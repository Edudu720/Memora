<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <!--
    Casal idoso — cabecalho das boas-vindas e avatar do cadastro e do login.

    Sem fundo de proposito: quem desenha o circulo colorido e o AvatarMemora.
    Assim a mesma ilustracao serve ao cabecalho, onde nao ha circulo nenhum.

    Desenhado em vetor, e nao recortado das capturas do prototipo, porque
    aquelas telas sao 390x844 — resolucao 1x. O avatar tem ~150px la, e num
    aparelho 3x precisaria de ~450px para nao borrar.
  -->
  <g>
    <!-- ============ Homem, atras e a direita ============ -->
    <!-- ombros -->
    <path d="M92 200 C92 160 112 142 138 142 C164 142 184 160 184 200 Z" fill="#6FA05A"/>
    <!-- gola -->
    <path d="M126 143 L138 158 L150 143 C146 141 130 141 126 143 Z" fill="#5B8749"/>
    <!-- pescoco -->
    <rect x="128" y="126" width="20" height="22" rx="9" fill="#E0A87E"/>
    <!-- rosto -->
    <ellipse cx="138" cy="98" rx="33" ry="36" fill="#EDBE95"/>
    <!-- cabelo branco, so as laterais e o topo -->
    <path d="M105 96 C103 66 120 56 138 56 C156 56 173 66 171 96
             C168 84 160 78 138 78 C116 78 108 84 105 96 Z" fill="#E4E6EC"/>
    <!-- oculos -->
    <g fill="none" stroke="#3E4A5B" stroke-width="3">
      <circle cx="126" cy="98" r="11"/>
      <circle cx="152" cy="98" r="11"/>
      <path d="M137 98 h4"/>
    </g>
    <!-- olhos -->
    <circle cx="126" cy="98" r="3.5" fill="#3E4A5B"/>
    <circle cx="152" cy="98" r="3.5" fill="#3E4A5B"/>
    <!-- sorriso -->
    <path d="M130 116 q9 8 18 0" fill="none" stroke="#B9764F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g>
    <!-- ============ Mulher, na frente e a esquerda ============ -->
    <!-- ombros -->
    <path d="M14 200 C14 166 33 150 58 150 C83 150 102 166 102 200 Z" fill="#F2B705"/>
    <!-- gola -->
    <path d="M46 151 L58 166 L70 151 C66 149 50 149 46 151 Z" fill="#D79E04"/>
    <!-- pescoco -->
    <rect x="48" y="134" width="20" height="22" rx="9" fill="#C98C63"/>
    <!-- rosto -->
    <ellipse cx="58" cy="106" rx="33" ry="36" fill="#D9A175"/>
    <!-- cabelo grisalho ondulado, cobrindo o topo e as laterais -->
    <path d="M25 108 C21 74 40 62 58 62 C76 62 95 74 91 108
             C88 96 86 92 78 88 C70 96 46 96 38 88 C30 92 28 96 25 108 Z" fill="#D2D5DE"/>
    <!-- oculos -->
    <g fill="none" stroke="#3E4A5B" stroke-width="3">
      <circle cx="46" cy="106" r="11"/>
      <circle cx="72" cy="106" r="11"/>
      <path d="M57 106 h4"/>
    </g>
    <!-- olhos -->
    <circle cx="46" cy="106" r="3.5" fill="#3E4A5B"/>
    <circle cx="72" cy="106" r="3.5" fill="#3E4A5B"/>
    <!-- sorriso -->
    <path d="M50 124 q9 8 18 0" fill="none" stroke="#8C5A3A" stroke-width="3" stroke-linecap="round"/>
    <!-- brinco -->
    <circle cx="26" cy="112" r="3.5" fill="#F2B705"/>
  </g>
</svg>
