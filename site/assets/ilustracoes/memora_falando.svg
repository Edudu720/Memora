<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <!--
    A Memora, falando — feature 004 (T010).

    Desenho original da equipe, a partir do robo do wireframe (Figuras 5-7 e 15
    do Arquivo X): cabeca azul da identidade, tela clara no lugar do rosto,
    bochechas rosadas, antena com a bola amarela e o peito amarelo.

    Sem fundo de proposito, como as outras ilustracoes de pessoa: quem desenha o
    medalhao e o MemoraPersonagem, e o medalhao muda de cor com o tema.

    As quatro expressoes saem do mesmo script e compartilham toda a geometria;
    so o que esta em "rosto" muda. Mexer na cabeca e mexer nas quatro.
  -->
  <!-- ============ corpo, cortado na base do quadro ============ -->
  <path d="M46 200 C46 172 66 156 100 156 C134 156 154 172 154 200 Z" fill="#3D63FF"/>
  <rect x="80" y="170" width="40" height="22" rx="8" fill="#FFC83D"/>
  <circle cx="92" cy="181" r="4" fill="#1040F8"/>
  <circle cx="108" cy="181" r="4" fill="#FF7A93"/>
  <!-- pescoco -->
  <rect x="88" y="140" width="24" height="20" rx="6" fill="#0B2BA8"/>
  <!-- ============ antena ============ -->
  <rect x="97" y="22" width="6" height="22" rx="3" fill="#0B2BA8"/>
  <circle cx="100" cy="20" r="10" fill="#FFC83D"/>
  <circle cx="96.5" cy="16.5" r="3" fill="#FFE7A3"/>
  <!-- ============ orelhas ============ -->
  <rect x="28" y="78" width="18" height="40" rx="9" fill="#0B2BA8"/>
  <rect x="154" y="78" width="18" height="40" rx="9" fill="#0B2BA8"/>
  <!-- ============ cabeca ============ -->
  <rect x="38" y="40" width="124" height="108" rx="40" fill="#1040F8"/>
  <!-- brilho da cabeca: o que da volume sem contorno -->
  <path d="M60 52 C70 46 84 44 96 44" stroke="#5B80FF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- ============ tela do rosto ============ -->
  <rect x="54" y="58" width="92" height="74" rx="28" fill="#F4F7FF"/>
  <!-- ============ rosto: falando ============ -->
  <circle cx="80" cy="88" r="8" fill="#0B1B4D"/>
  <circle cx="120" cy="88" r="8" fill="#0B1B4D"/>
  <circle cx="82.5" cy="85.5" r="2.5" fill="#FFFFFF"/>
  <circle cx="122.5" cy="85.5" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="68" cy="110" rx="9" ry="6" fill="#FF9FB2"/>
  <ellipse cx="132" cy="110" rx="9" ry="6" fill="#FF9FB2"/>
  <path d="M88 106 Q100 106 112 106 Q110 122 100 122 Q90 122 88 106 Z" fill="#0B1B4D"/>
  <path d="M93 116 Q100 112 107 116 Q104 121 100 121 Q96 121 93 116 Z" fill="#FF7A93"/>
</svg>
