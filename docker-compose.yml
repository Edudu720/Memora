# Ambiente de desenvolvimento do Memora (T003).
#
# Sobe o PostgreSQL 16 usado pelo backend em desenvolvimento local:
#
#   docker compose up -d      # inicia o banco
#   docker compose down       # para o banco, preservando os dados
#   docker compose down -v    # para e APAGA os dados
#
# As credenciais abaixo valem SOMENTE para desenvolvimento local.
# Produção usa segredos injetados pelo ambiente, nunca este arquivo.

services:
  banco:
    image: postgres:16
    container_name: memora-postgres
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora-dev
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
