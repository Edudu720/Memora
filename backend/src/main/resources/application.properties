spring.application.name=memora

# Porta do servidor (no Render ou em container, vem da variavel PORT)
server.port=${PORT:8080}

# Banco de desenvolvimento local: o docker-compose.yml da raiz do repositorio.
# Os valores abaixo sao apenas o padrao de desenvolvimento. Em producao cada um
# vem do ambiente, nunca do repositorio.
spring.datasource.url=${MEMORA_DB_URL:jdbc:postgresql://localhost:5432/memora}
spring.datasource.username=${MEMORA_DB_USUARIO:memora}
spring.datasource.password=${MEMORA_DB_SENHA:memora-dev}

# O Flyway e o dono do esquema; o Hibernate nunca cria nem altera tabela.
# "validate" transforma a subida da aplicacao em portao: entidade que divergir
# da migration derruba o contexto, em vez de gerar coluna fantasma em silencio.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Sessao de persistencia aberta durante a renderizacao esconde consulta N+1 e
# atrasa resposta. A camada de API recebe DTO, nunca entidade gerenciada.
spring.jpa.open-in-view=false

# O FiltroRastreio (T026) poe traceId e requestId no MDC. Sem declarar o padrao
# de correlacao, o Spring Boot nao os imprime, e o rastro existe sem aparecer no
# log - que e o unico lugar onde ele serve para alguma coisa.
logging.pattern.correlation=[${spring.application.name:memora},%X{traceId:-},%X{requestId:-}]

# Chave do HMAC que resume o endereco de origem na trilha de auditoria (T026).
#
# Deliberadamente SEM valor padrao. Um padrao aqui seria segredo commitado, e o
# pior tipo: nada falharia, e a trilha de quem esquecesse de configurar ficaria
# reversivel por qualquer pessoa que lesse este repositorio. Sem a variavel, a
# ConfiguracaoDeRastreio sorteia a chave na subida e avisa em WARN.
#
# Em producao, defina MEMORA_CHAVE_ORIGEM com no minimo 32 bytes e mantenha
# estavel: se trocar, a contagem por origem do LimitadorTentativas (R4) recomeca.
memora.rastreio.chave-de-origem=${MEMORA_CHAVE_ORIGEM:}

# Chave HMAC para geracao e validacao dos tokens JWT de acesso (FR-036).
# Em producao, defina MEMORA_TOKEN_SEGREDO em base64 com no minimo 256 bits (32 bytes).
memora.token.segredo=${MEMORA_TOKEN_SEGREDO:}

# O RegistroDeAuditoria grava evento de recusa em transacao propria
# (REQUIRES_NEW), para que o rollback da operacao nao leve a trilha junto. O
# preco e que, durante essa gravacao, a requisicao segura DUAS conexoes: a da
# transacao de fora e a da de dentro. Com o padrao do Hikari (10), bastam 10
# requisicoes simultaneas nesse trecho para o pool esperar por si mesmo.
#
# O valor esta explicito, e nao no padrao, para que a conta apareca: o teto de
# requisicoes simultaneas em operacao auditada e metade deste numero.
spring.datasource.hikari.maximum-pool-size=20

# O provedor de IA da assistente (feature 003, ADR-002).
#
# Vazio (o padrao): ClienteDaAssistenteSimulado, com roteiros fixos. E o que roda
# nos testes e para quem clona o repositorio: sem rede e sem chave.
# "gemini": o adaptador real, que exige GEMINI_API_KEY.
# Com o perfil "producao" o provedor e sempre o gemini, e o simulado nao existe.
# Valor desconhecido derruba a subida: cair no simulado em silencio faria quem
# acredita testar o modelo real falar com um roteiro fixo.
memora.assistente.provedor=${MEMORA_ASSISTENTE_PROVEDOR:}

# A chave da API do Gemini.
#
# Deliberadamente SEM valor padrao, pelo mesmo motivo da chave de origem acima:
# nada de segredo no repositorio, nem de exemplo. Diferente dela, porem, nao ha
# valor sorteado que sirva: sem a chave o provedor "gemini" nao sobe (R8), com
# uma mensagem que diz o que falta. Nunca aparece em log, excecao nem URL.
memora.assistente.gemini.chave=${GEMINI_API_KEY:}

# O modelo. Estavel e gratuito na decisao de 2026-10-02 (ADR-002); configuravel por variavel.
memora.assistente.gemini.modelo=${MEMORA_ASSISTENTE_GEMINI_MODELO:gemini-3.8-flash}

# Quanto esperar para conectar, e quanto esperar SEM receber nada (inicio da
# resposta e cada trecho dela). Em segundos.
memora.assistente.gemini.timeout-conexao-segundos=10
memora.assistente.gemini.timeout-leitura-segundos=60
