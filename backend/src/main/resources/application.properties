spring.application.name=memora

# Banco de desenvolvimento local: o docker-compose.yml da raiz do repositorio.
# Os valores abaixo sao apenas o padrao de desenvolvimento. Em producao cada um
# vem do ambiente, nunca do repositorio.
spring.datasource.url=${MEMORA_DB_URL:jdbc:postgresql://localhost:5432/memora}
spring.datasource.username=${MEMORA_DB_USUARIO:memora}
spring.datasource.password=${MEMORA_DB_SENHA:memora-dev}

# O Flyway e o dono do esquema; o Hibernate nunca cria nem altera tabela.
# "validate" transforma a subida da aplicacao em portao: entidade que divergir
# da migration derruba o contexto, em vez de gerar coluna fantasma em silencio.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Sessao de persistencia aberta durante a renderizacao esconde consulta N+1 e
# atrasa resposta. A camada de API recebe DTO, nunca entidade gerenciada.
spring.jpa.open-in-view=false

# O FiltroRastreio (T026) poe traceId e requestId no MDC. Sem declarar o padrao
# de correlacao, o Spring Boot nao os imprime, e o rastro existe sem aparecer no
# log - que e o unico lugar onde ele serve para alguma coisa.
logging.pattern.correlation=[${spring.application.name:memora},%X{traceId:-},%X{requestId:-}]

# Chave do HMAC que resume o endereco de origem na trilha de auditoria (T026).
# Valor abaixo e SO para desenvolvimento. Em producao vem do ambiente: se
# trocar, a contagem por origem do LimitadorTentativas (R4) recomeca do zero.
memora.rastreio.chave-de-origem=${MEMORA_CHAVE_ORIGEM:memora-dev-chave-de-origem}
