# Blueprint do Render para o Memora Backend
# Documentacao: https://render.com/docs/blueprint-spec

# Sem secao "databases": o banco e o Neon (plano gratuito, aws-us-east-1), criado
# fora do Render. A regiao virginia fica perto dele e a mais perto do Brasil
# entre as do Render.

services:
  - type: web
    name: memora-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: virginia
    # O liveness nao toca no banco. O /actuator/health toca, e o Neon gratuito dorme
    # sem uso e cobra tempo de computacao a cada consulta do Render.
    healthCheckPath: /actuator/health/liveness
    envVars:
      # URL DIRETA do Neon (a do painel "Connection string" sem o "Pooled
      # connection"), nunca a do host "-pooler": o PgBouncer em modo transacao
      # atrapalha o Flyway. Formato:
      #   postgresql://usuario:senha@host/banco?sslmode=require
      # O docker-entrypoint.sh a converte em jdbc:postgresql://host/banco?...
      # com usuario e senha separados. Um "&channel_binding=require" no fim e
      # aceito e ignorado pelo driver.
      - key: DATABASE_URL
        sync: false
      - key: MEMORA_ASSISTENTE_PROVEDOR
        value: gemini
      - key: MEMORA_ASSISTENTE_GEMINI_MODELO
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: MEMORA_TOKEN_SEGREDO
        generateValue: true
      - key: MEMORA_CHAVE_ORIGEM
        generateValue: true

