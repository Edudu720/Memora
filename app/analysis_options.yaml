# Análise estática do Memora.
#
# Regras alinhadas à Constituição do projeto: o Design System não pode ser
# erodido por valores literais espalhados pelas telas (FR-002, FR-032).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**

linter:
  rules:
    # Clareza de código
    - always_declare_return_types
    - prefer_final_locals
    - prefer_const_declarations
    - unnecessary_this

    # Contenção da erosão do Design System
    - avoid_redundant_argument_values
    - use_colored_box
    - use_decorated_box

    # Robustez
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - throw_in_finally

    # Todo componente público do Design System precisa estar documentado
    - public_member_api_docs
