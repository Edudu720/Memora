name: memora
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

  # Token e refresh vao para o Keystore, nunca para shared_preferences
  # (FR-036, R7). O cenario V8 inspeciona o aparelho depois da saida e reprova
  # se sobrar qualquer credencial.
  flutter_secure_storage: ^9.2.4

  # Ilustracoes vetoriais das telas de autenticacao. SVG e texto, entao as
  # ilustracoes ficam revisaveis em diff e escalam sem borrar em qualquer
  # densidade de tela — o que um PNG recortado do prototipo (390x844, 1x) nao
  # faria num aparelho 3x. A alternativa sem dependencia seria CustomPainter,
  # que ninguem consegue revisar.
  flutter_svg: ^2.0.17

  # Diretorio privado do aplicativo, onde a conversa com a assistente e
  # guardada (FR-047). Ja vinha como dependencia transitiva; declarada aqui
  # porque depender de transitiva quebra sem aviso quando a de cima muda.
  path_provider: ^2.1.5

  # Abre outro aplicativo Android depois da confirmacao da pessoa (FR-015).
  # Quem abre e o aplicativo, nunca o servidor — ver R10 do research.
  android_intent_plus: ^5.3.0

  # Cliente da API gerado de contracts/openapi.yaml (T027, R8). Mora fora de
  # lib/ porque o dart-dio gera um pacote completo, com pubspec próprio: dentro
  # de lib/ ele não seria dependência de ninguém, e código que nada importa não
  # compila nem quebra — fica invisível até o dia em que precisa funcionar.
  memora_api:
    path: pacotes/memora_api

  # Declarado direto, e nao herdado do memora_api: a camada `data` usa Response
  # e DioException nas proprias assinaturas. Depender disso por transitividade
  # significaria o app quebrar no dia em que o cliente gerado trocasse de
  # transporte.
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Lê o `openapi.yaml` no teste que prende o leitor de SSE ao contrato (T110).
  # Já vinha no lock como dependência transitiva; declarada aqui porque depender
  # de transitiva quebra sem aviso quando a de cima muda. Parsear o YAML de
  # verdade — em vez de expressão regular sobre texto — é o que faz o teste
  # enxergar `enum` e `required` como o gerador os enxerga.
  yaml: ^3.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/ilustracoes/
    # Os ícones da barra inferior, em pares contorno/preenchido (T112).
    - assets/icones/navegacao/
    # A licença da fonte vai junto, e aparece em "Licenças" do aplicativo.
    - assets/fontes/atkinson_hyperlegible_next/OFL.txt
    # Guias de aplicativos cotidianos (T071, T072)
    - assets/guias/whatsapp/
    - assets/guias/instagram/
    - assets/guias/youtube/
    - assets/guias/facebook/
    - assets/guias/google-fotos/
    - assets/guias/telegram/
    - assets/guias/tiktok/
    # Guias de serviços sociais (T078, T079, T081, T082)
    - assets/guias/gov-br/
    - assets/guias/meu-inss/
    - assets/guias/e-titulo/
    - assets/guias/serasa/
    - assets/guias/fgts/
    - assets/guias/poupatempo/
    - assets/guias/carteira-digital/
    - assets/guias/correios/
    - assets/guias/carteira-de-trabalho/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Atkinson Hyperlegible Next, desenhada para baixa visao (R3 da feature 004).
  # Os tres pesos sao instancias estaticas da fonte variavel -- ver ORIGEM.md
  # na mesma pasta. Um peso novo precisa ser gerado e declarado aqui.
  #
  # As pastas de `assets/guias/<chave>/` NAO estao declaradas acima: o Flutter
  # nao le subpasta sozinho, e declarar pasta que ainda nao existe quebra o
  # build. Cada guia acrescenta a propria linha quando nasce (fases 6 e 7).
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fontes/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fontes/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
