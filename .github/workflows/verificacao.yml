name: Verificação

# Portões automatizados exigidos pela Constituição do projeto.
# Acessibilidade só sobrevive a refatoração se estiver automatizada.

on:
  push:
    branches: [master]
  # Sem filtro de branch de destino: cada fase do tasks.md vira uma PR, e uma
  # PR empilhada sobre outra tem destino diferente de master. Com o filtro
  # antigo (`branches: [master]`) essas PRs passavam sem verificação nenhuma.
  pull_request:

jobs:
  contraste:
    name: Contraste da paleta (WCAG 2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar os 48 pares dos três temas
        run: python specs/002-design-system/ferramentas/validar_paleta.py

  backend:
    name: Build e testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test

  app:
    name: Análise e testes do aplicativo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Instalar dependências
        run: flutter pub get
      - name: Análise estática
        run: flutter analyze
      - name: Testes
        run: flutter test
