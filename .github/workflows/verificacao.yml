name: Verificação

# Portões automatizados exigidos pela Constituição do projeto.
# Acessibilidade só sobrevive a refatoração se estiver automatizada.

on:
  push:
    branches: [master]
  # Sem filtro de branch de destino: cada fase do tasks.md vira uma PR, e uma
  # PR empilhada sobre outra tem destino diferente de master. Com o filtro
  # antigo (`branches: [master]`) essas PRs passavam sem verificação nenhuma.
  pull_request:

jobs:
  contraste:
    name: Contraste da paleta (WCAG 2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provar que o validador reprova paleta de contraste ruim (autoteste)
        run: python specs/002-design-system/ferramentas/validar_paleta.py --autoteste
      - name: Validar os pares de cada tema, e de cada paleta nos temas claro e escuro
        run: python specs/002-design-system/ferramentas/validar_paleta.py

  tokens:
    # T047 — o portão da FR-032. Sem ele, valor literal volta na terceira tela
    # e a consistência se perde sem ninguém ver. Quando esta regra foi escrita,
    # havia sete tamanhos de ícone diferentes no aplicativo, nenhum declarado.
    name: Valor literal fora dos tokens (FR-032)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provar que o portão reprova o que deve (autoteste)
        run: python specs/002-design-system/ferramentas/validar_tokens.py --autoteste
      - name: Varrer app/lib/ atrás de cor, espaçamento e tamanho literais
        run: python specs/002-design-system/ferramentas/validar_tokens.py

  backend:
    name: Build e testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test

  app:
    name: Análise e testes do aplicativo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Instalar dependências
        run: flutter pub get
      - name: Análise estática
        run: flutter analyze
      - name: Testes
        run: flutter test

  cliente-gerado:
    name: Cliente da API gerado do contrato
    runs-on: ubuntu-latest
    # O pacote é gerado de contracts/openapi.yaml e nunca editado à mão (R8).
    # Verificar aqui é o que impede que uma regeração quebrada passe despercebida:
    # ninguém edita este código, então nada mais o exercita até o dia em que uma
    # tela precisar dele.
    defaults:
      run:
        working-directory: app/pacotes/memora_api
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Instalar dependências
        run: dart pub get
      - name: Análise estática
        run: dart analyze
      - name: Testes
        run: dart test
